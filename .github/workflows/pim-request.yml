name: PIM Approval

on:
  issues:
    types: [opened]

jobs:
  submit-request:
    runs-on: ubuntu-latest

    steps:

      - name: Extract Fields
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;

            function getField(name) {
              const regex = new RegExp(`### ${name}\\s*([\\s\\S]*?)(\\n###|$)`);
              const match = body.match(regex);
              return match ? match[1].trim() : "";
            }

            const payload = {
              email: getField("User Email"),
              role: getField("Azure Role"),
              scope: getField("Scope"),
              duration: getField("Duration Hours"),
              justification: getField("Business Justification"),
              issueNumber: context.payload.issue.number
            };

            core.setOutput("payload", JSON.stringify(payload));

      - name: Send To Logic App
        run: |
          curl -X POST "${{ secrets.LOGICAPP_URL }}" \
          -H "Content-Type: application/json" \
          -d '${{ steps.extract.outputs.payload }}'
