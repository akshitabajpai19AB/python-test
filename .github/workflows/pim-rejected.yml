name: Handle Rejected PIM Request

on:
  repository_dispatch:
    types: [pim-rejected]

permissions:
  issues: write

jobs:
  reject-request:
    runs-on: ubuntu-latest

    steps:

      - name: Comment and Close Issue
        uses: actions/github-script@v7
        with:
          script: |

            const issueNumber =
              context.payload.client_payload.issueNumber;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: '❌ PIM Access Request Rejected.'
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
